[package]
name = "pwsh-sdk-ffi"
version = "0.14.2"
edition = "2018"
license = "MIT/Apache-2.0"
publish = false
build = "build.rs"

[lib]
name = "multi_pwsh_sdk"
crate-type = ["cdylib"]

[dependencies]
pwsh-host = { path = "../pwsh-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"
