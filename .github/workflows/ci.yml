name: CI

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PowerShell 7.4 for binding discovery
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Install-PowerShell74ForCi.ps1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy --toolchain stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PowerShell 7.4 for binding discovery
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Install-PowerShell74ForCi.ps1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install multi-pwsh from source
        shell: pwsh
        run: cargo install --locked --path crates/multi-pwsh --force

      - name: Add cargo bin to PATH
        shell: pwsh
        run: |
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $cargoBin = Join-Path $cargoHome 'bin'
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add multi-pwsh alias bin to PATH (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $multiPwshHome = if ($env:MULTI_PWSH_HOME) { $env:MULTI_PWSH_HOME } else { Join-Path $HOME '.pwsh' }
          $multiPwshBin = if ($env:MULTI_PWSH_BIN_DIR) { $env:MULTI_PWSH_BIN_DIR } else { Join-Path $multiPwshHome 'bin' }
          $multiPwshBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add multi-pwsh alias bin to PATH (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          multi_pwsh_home="${MULTI_PWSH_HOME:-$HOME/.pwsh}"
          multi_pwsh_bin="${MULTI_PWSH_BIN_DIR:-${multi_pwsh_home}/bin}"
          echo "$multi_pwsh_bin" >> "$GITHUB_PATH"

      - name: Cache multi-pwsh downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/multi-pwsh-cache
          key: multi-pwsh-cache-${{ runner.os }}-${{ hashFiles('crates/multi-pwsh/Cargo.toml', '.github/workflows/ci.yml') }}
          restore-keys: |
            multi-pwsh-cache-${{ runner.os }}-

      - name: Install PowerShell aliases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MULTI_PWSH_CACHE_KEEP: '1'
        run: |
          multi-pwsh install stable
          multi-pwsh install preview
          multi-pwsh install lts
          multi-pwsh install 7.4
          multi-pwsh install 7.5

      - name: Verify PowerShell aliases
        shell: pwsh
        run: |
          $stableVersion = & pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          $previewLabel = & pwsh-preview -NoLogo -NoProfile -Command '$label = [string]$PSVersionTable.PSVersion.PreReleaseLabel; if ([string]::IsNullOrWhiteSpace($label)) { throw "Expected pwsh-preview to resolve to a prerelease build." }; $label'
          $ltsVersion = & pwsh-lts -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          & multi-pwsh alias set pwsh-preview preview
          & multi-pwsh alias set pwsh-lts lts
          Write-Host "pwsh -> $stableVersion"
          Write-Host "pwsh-preview -> $previewLabel"
          Write-Host "pwsh-lts -> $ltsVersion"
          pwsh-7.4 -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          pwsh-7.5 -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Configure static MSVC runtime
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          "RUSTFLAGS=-C target-feature=+crt-static" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Rust targets
        run: cargo build --all-targets

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Run multi-pwsh venv integration tests
        shell: pwsh
        run: cargo test -p multi-pwsh --test cli_args venv

      - name: Build .NET project
        shell: pwsh
        run: dotnet build dotnet/bindings/Devolutions.PowerShell.SDK.Bindings.csproj -p:PwshExePath="$env:PwshExePath"

      - name: Run .NET tests
        shell: pwsh
        run: dotnet test dotnet/bindings/Devolutions.PowerShell.SDK.Bindings.csproj --no-build -p:PwshExePath="$env:PwshExePath"

  nuget-cli:
    name: NuGet package smoke (Windows)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PowerShell 7.4 for binding discovery
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Install-PowerShell74ForCi.ps1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - name: Build and pack native NuGet package
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'scripts\Build-NativeNuGetPackages.ps1') `
            -RuntimeIdentifiers 'win-x64' `
            -Clean

      - name: Smoke test PackageReference copy targets
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path 'artifacts\native-nuget').Path
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'multi-pwsh-cli-package-smoke'
          $env:NUGET_PACKAGES = Join-Path $env:RUNNER_TEMP 'multi-pwsh-cli-package-smoke-nuget-cache'
          New-Item -Path $smokeRoot -ItemType Directory -Force | Out-Null
          New-Item -Path $env:NUGET_PACKAGES -ItemType Directory -Force | Out-Null

          $package = Get-ChildItem -Path $packageSource -Filter 'Devolutions.MultiPwsh.Cli.*.nupkg' | Select-Object -First 1
          if ($null -eq $package) {
            throw 'Smoke test package was not found.'
          }

          $version = $package.BaseName.Substring('Devolutions.MultiPwsh.Cli.'.Length)

          dotnet new console --framework net8.0 --output $smokeRoot
          if ($LASTEXITCODE -ne 0) { throw 'Smoke project creation failed.' }

          $projectPath = Join-Path $smokeRoot 'multi-pwsh-cli-package-smoke.csproj'
          $project = Get-Content -Path $projectPath -Raw
          $project = $project -replace '</Project>', @"
            <ItemGroup>
              <PackageReference Include="Devolutions.MultiPwsh.Cli" Version="$version" />
            </ItemGroup>
          </Project>
          "@
          Set-Content -Path $projectPath -Value $project -Encoding utf8

          $nugetConfig = Join-Path $smokeRoot 'NuGet.Config'
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$packageSource" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          "@ | Set-Content -Path $nugetConfig -Encoding utf8

          dotnet build $projectPath --configfile $nugetConfig
          if ($LASTEXITCODE -ne 0) { throw 'Smoke project build failed.' }

          $expected = Join-Path $smokeRoot 'bin\Debug\net8.0\runtimes\win-x64\native\multi-pwsh.exe'
          if (-not (Test-Path -Path $expected -PathType Leaf)) {
            throw "Expected smoke output file was not found: $expected"
          }

      - name: Smoke test AppHost mode targets
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'tests\Invoke-AppHostNuGetPackageSmokeTest.ps1') `
            -PackageSource (Resolve-Path 'artifacts\native-nuget') `
            -RuntimeIdentifier 'win-x64'

  nuget-apphost-linux:
    name: NuGet CLI AppHost smoke (Linux)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install PowerShell 7.4 for binding discovery
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/Install-PowerShell74ForCi.ps1

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu
          rustup default stable

      - name: Build and pack native NuGet package
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'scripts/Build-NativeNuGetPackages.ps1') `
            -RuntimeIdentifiers 'linux-x64' `
            -Clean

      - name: Smoke test AppHost mode targets
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'tests/Invoke-AppHostNuGetPackageSmokeTest.ps1') `
            -PackageSource (Resolve-Path 'artifacts/native-nuget') `
            -RuntimeIdentifier 'linux-x64'
